services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-recipes}
    ports:
      - "5454:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recipes}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
  api:
    build: .
    environment:
      APP_PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-recipes}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
    ports:
      - "8080:8080"
    depends_on:
      db: 
        condition: service_healthy

volumes:
  pgdata: